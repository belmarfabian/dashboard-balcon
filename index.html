<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discursos del balcón - Frecuencia léxica (corpus estricto)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* ── Reset & base ─────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;margin:0}
body{height:100%;margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#FFFFFF;color:#333;display:flex;align-items:center;justify-content:center;overflow:hidden}
#canvas{width:min(100vw, 177.78vh);height:min(100vh, 56.25vw);max-width:1440px;max-height:810px;display:flex;flex-direction:column;padding:20px 36px 10px;gap:10px;overflow:hidden}
#panels-row{flex:1;min-height:0;display:flex;gap:14px;overflow:hidden}
#controls-row{flex-shrink:0}
#footer{height:22px;flex-shrink:0;min-height:22px}

/* ── Main panels (floating cards) ─────────────────────── */
#panel-left{flex:3;display:flex;flex-direction:column;background:#fff;border-radius:10px;border:1px solid #e0ddd8;overflow:hidden}
#panel-right{flex:2;display:flex;flex-direction:column;background:#fff;border-radius:10px;border:1px solid #e0ddd8;overflow:hidden}

.panel-header{height:30px;display:flex;align-items:center;justify-content:center;padding:0 12px;background:#556B2F;color:#fff;font-size:13px;font-weight:600;letter-spacing:.3px;flex-shrink:0}
.panel-body{flex:1;position:relative;overflow:hidden;min-height:0}

#graph-svg{width:100%;height:100%}
#wordcloud{width:100%;height:100%;position:relative;overflow:hidden}
#wc-inner{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:center center;transition:transform .15s ease-out}

/* ── Controls: 2 groups aligned with panels (60/40) ───── */
#controls{display:flex;gap:14px;align-items:stretch}
#ctrl-left,#ctrl-right{display:flex;gap:8px;align-items:stretch}
#ctrl-left{flex:3;min-width:0}
#ctrl-right{flex:2;min-width:0}
.ctrl-card{background:#fff;border-radius:10px;border:1px solid #e0ddd8;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ctrl-card .ctrl-label{font-size:9px;color:#fff;font-weight:600;text-transform:none;letter-spacing:.3px;background:#556B2F;padding:4px 12px;margin:0;border-radius:10px 10px 0 0;text-align:center}
.ctrl-card .ctrl-content{padding:5px 12px;display:flex;align-items:center;gap:8px;flex:1}
.ctrl-card.card-pres{flex:2.3;overflow:hidden}
.ctrl-card.card-pres .pres-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.ctrl-card.card-search{flex:0.7}
.ctrl-card.card-slider{flex:5}
.ctrl-card.card-top{flex:3}
.pres-pills button{font-size:10.5px;padding:4px 10px;border:1px solid #ccc;background:#fff;color:#444;cursor:pointer;font-weight:500;white-space:nowrap;transition:all .15s;border-radius:6px}
.pres-pills button.active{background:#556B2F;color:#fff;border-color:#556B2F;font-weight:700}
.pres-pills button:hover:not(.active){background:#f3f3f3}
.search-wrap{position:relative;width:100%}
#search-input{font-size:11px;padding:4px 24px 4px 8px;border:1px solid #ddd;border-radius:6px;width:100%;outline:none;background:#fafafa}
#search-input:focus{border-color:#556B2F;background:#fff}
.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:none;background:#ddd;color:#fff;font-size:10px;line-height:16px;text-align:center;border-radius:50%;cursor:pointer;padding:0}
.search-clear:hover{background:#556B2F}
#top-select{font-size:11px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;outline:none;background:#fafafa;width:100%}

/* ── Footer ───────────────────────────────────────────── */
#footer{display:flex;align-items:center;justify-content:center;padding:0 44px;font-size:9.5px;color:#999;flex-shrink:0}

/* ── Word cloud spans ─────────────────────────────────── */
.wc-word{position:absolute;white-space:nowrap;cursor:default;font-weight:600;transition:opacity .3s;opacity:0}
.wc-word.visible{opacity:1}
.wc-word.dimmed{opacity:.12}
.wc-word.highlighted{text-decoration:underline;text-decoration-color:#556B2F}

/* ── Graph ────────────────────────────────────────────── */
.link{fill:none;stroke-opacity:.55}
.node circle{stroke:#fff;stroke-width:1px}
.node text{font-size:9.5px;fill:#555;pointer-events:none;font-weight:500}
.node.dimmed circle{opacity:.12}
.node.dimmed text{opacity:.12}
.link.dimmed{stroke-opacity:.04}
.node.highlighted text{font-weight:800;fill:#556B2F}

/* ── Tooltip ──────────────────────────────────────────── */
.tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.8);color:#fff;padding:5px 10px;border-radius:4px;font-size:11px;opacity:0;transition:opacity .15s;z-index:999}

/* ── Responsive ──────────────────────────────────────── */
@media(max-width:900px){
  #canvas{padding:14px 20px 8px}
}
@media(max-width:700px){
  #canvas{padding:10px 12px 6px}
  #panels-row{flex-direction:column}
  #page2-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── Frequency slider ────────────────────────────────── */
.freq-row{display:flex;gap:6px;align-items:center}
.freq-range{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#e0e0e0;border-radius:2px;outline:none;min-width:20px}
.freq-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#556B2F;cursor:pointer;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.2)}
.freq-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#556B2F;cursor:pointer;border:2px solid #fff}
.freq-num{width:45px;font-size:11px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;text-align:center;outline:none;background:#fafafa;-moz-appearance:textfield}
.freq-num::-webkit-inner-spin-button,.freq-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.freq-num:focus{border-color:#556B2F;background:#fff}

/* ── Page navigation ─────────────────────────────────── */
.page-nav{display:flex;align-items:center;gap:4px;user-select:none}
.page-nav .pn-btn{cursor:pointer;font-size:11px;color:#999;padding:0 3px;transition:color .15s}
.page-nav .pn-btn:hover{color:#556B2F}
.page-nav .pn-btn.disabled{opacity:.3;pointer-events:none}
.page-nav .pn-text{font-size:9.5px;color:#999}

/* ── Page 2: 3×3 grid ────────────────────────────────── */
#page1-content{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px;overflow:hidden}
#page2-content-wrapper{display:none;flex:1;min-height:0;overflow:hidden}
#page2-main{display:flex;flex:1;min-height:0;gap:10px;height:100%}
#page2-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;min-height:0;height:100%}
#page2-sidebar{flex:0 0 110px;display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:9px}
.mini-panel{background:#fff;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e0ddd8;cursor:pointer;transition:box-shadow .2s}
.mini-panel:hover{box-shadow:0 2px 12px rgba(0,0,0,.15)}
/* Expanded overlay */
#panel-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
#panel-overlay.active{display:flex}
#panel-expanded{width:55%;height:60%;background:#fff;border-radius:12px;border:1px solid #e0ddd8;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#panel-expanded .expanded-header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:30px;color:#fff;font-size:12px;font-weight:600;flex-shrink:0;border-radius:12px 12px 0 0}
#panel-expanded .expanded-body{flex:1;min-height:0;position:relative}
#panel-expanded .expanded-body svg{width:100%;height:100%;display:block}
.expanded-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.7}
.expanded-close:hover{opacity:1}
.mini-header{font-size:9px;font-weight:600;padding:3px 8px;color:#fff;flex-shrink:0;border-radius:10px 10px 0 0;text-align:center}
.mini-body{flex:1;min-height:0}
.mini-body svg{width:100%;height:100%;display:block}

/* ── Page 2 sidebar controls ─────────────────────────── */
#page2-sidebar .ctrl-card{flex:0 0 auto}
#page2-sidebar input[type="text"]{width:100%;font-size:10px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;background:#fafafa;outline:none}
#page2-sidebar input[type="text"]:focus{border-color:#556B2F;background:#fff}
#page2-sidebar select{width:100%;font-size:10px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;background:#fafafa;outline:none}
</style>
</head>
<body>

<!-- ════════ CANVAS (Power BI style) ════════ -->
<div id="canvas">
  <!-- Page 1 -->
  <div id="page1-content">
    <!-- Panels row -->
    <div id="panels-row">
      <div id="panel-left">
        <div class="panel-header">Redes de bigramas (corpus estricto)</div>
        <div class="panel-body"><svg id="graph-svg"></svg></div>
      </div>
      <div id="panel-right">
        <div class="panel-header">Nube de palabras (corpus estricto)</div>
        <div class="panel-body"><div id="wordcloud"></div></div>
      </div>
    </div>
  </div><!-- /page1-content -->
  <!-- Page 2 -->
  <div id="page2-content-wrapper">
    <div id="page2-main">
      <div id="page2-grid"></div>
      <div id="page2-sidebar"></div>
    </div>
  </div>
  <!-- Controls card (visible on both pages, disabled on page 2) -->
  <div id="controls-row">
    <div id="controls">
      <div id="ctrl-left">
        <div class="ctrl-card card-pres">
          <span class="ctrl-label">Presidente</span>
          <div class="ctrl-content"><div class="pres-pills" id="pres-pills"></div></div>
        </div>
        <div class="ctrl-card card-search">
          <span class="ctrl-label">Búsqueda por término</span>
          <div class="ctrl-content"><div class="search-wrap"><input id="search-input" type="text" placeholder="término..."><button class="search-clear" id="search-clear">✕</button></div></div>
        </div>
      </div>
      <div id="ctrl-right">
        <div class="ctrl-card card-slider">
          <span class="ctrl-label">Frecuencia término</span>
          <div class="ctrl-content freq-row">
            <input type="number" id="freq-min" min="0" value="0" class="freq-num">
            <input type="range" id="freq-slider" min="0" max="10" step="1" value="0" class="freq-range">
            <input type="number" id="freq-max" min="0" value="99" class="freq-num">
          </div>
        </div>
        <div class="ctrl-card card-top">
          <span class="ctrl-label">Top</span>
          <div class="ctrl-content">
            <select id="top-select">
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50" selected>50</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- ════════ FOOTER ════════ -->
  <div id="footer">
    <span class="page-nav">
      <span class="pn-btn" id="pn-prev">&#9664;</span>
      <span class="pn-text" id="pn-label">1 de 2</span>
      <span class="pn-btn" id="pn-next">&#9654;</span>
    </span>
  </div>
</div>

<!-- ════════ EXPANDED OVERLAY ════════ -->
<div id="panel-overlay">
  <div id="panel-expanded">
    <div class="expanded-header" id="expanded-header"><span id="expanded-title"></span><button class="expanded-close" id="expanded-close">✕</button></div>
    <div class="expanded-body" id="expanded-body"></div>
  </div>
</div>

<!-- ════════ TOOLTIP ════════ -->
<div class="tooltip" id="tooltip"></div>

// frequency inputs + slider
const freqMinEl = document.getElementById("freq-min");
const freqMaxEl = document.getElementById("freq-max");
const freqSlider = document.getElementById("freq-slider");
let freqMax = 99;

function updateFreqRange() {
  let maxN;
  if (currentPres === "Todos") {
    const agg = {};
    UNI_RAW.forEach(d => { agg[d.w] = (agg[d.w] || 0) + d.n; });
    maxN = d3.max(Object.values(agg)) || 1;
  } else {
    const words = UNI_RAW.filter(d => d.p === currentPres);
    maxN = words.length ? d3.max(words, d => d.n) : 1;
  }
  freqMaxEl.value = maxN;
  freqMinEl.value = 0;
  freqSlider.max = maxN;
  freqSlider.value = 0;
  freqMin = 0;
  freqMax = maxN;
}

// Build unigram frequency lookup
function getUnigramFreqs(pres) {
  const freqs = {};
  if (pres === "Todos") {
    UNI_RAW.forEach(d => { freqs[d.w] = (freqs[d.w] || 0) + d.n; });
  } else {
    UNI_RAW.filter(d => d.p === pres).forEach(d => { freqs[d.w] = d.n; });
  }
  return freqs;
}

function applyFreqFilter() {
  freqMin = +freqMinEl.value || 0;
  freqMax = +freqMaxEl.value || 99;
  buildGraph();
  buildWordCloud();
  if (searchTerm) applySearch();
}

freqMinEl.addEventListener("change", () => {
  freqSlider.value = freqMinEl.value;
  applyFreqFilter();
});
freqMaxEl.addEventListener("change", applyFreqFilter);
freqSlider.addEventListener("input", () => {
  freqMinEl.value = freqSlider.value;
  applyFreqFilter();
});

function getOrientation(pres) {
  if (pres === "Todos") return "centro";
  const rec = UNI_RAW.find(d => d.p === pres);
  return rec ? rec.o : "centro";
}

function getBaseColor(pres) {
  if (pres === "Todos") return "#7EA8C9";
  return ORIENT_COLOR[getOrientation(pres)] || "#999";
}

function edgeColorPalette(base) {
  const h = d3.hsl(d3.color(base));
  return [
    base,
    h.copy({h: h.h - 30, l: Math.max(0, h.l - 0.1)}).formatHex(),
    h.copy({h: h.h + 40, l: Math.min(0.7, h.l + 0.05)}).formatHex(),
    h.copy({l: Math.max(0, h.l - 0.2)}).formatHex(),
    h.copy({h: h.h + 80, s: Math.min(1, h.s + 0.1)}).formatHex(),
    h.copy({h: h.h - 60, l: Math.min(0.6, h.l + 0.1)}).formatHex(),
    h.copy({l: Math.min(0.75, h.l + 0.2)}).formatHex()
  ];
}

// ═══════════════════════════════════════════════════════════
//  FORCE GRAPH
// ═══════════════════════════════════════════════════════════
const svg = d3.select("#graph-svg");
const graphG = svg.append("g");
const zoomBehavior = d3.zoom().scaleExtent([0.3, 5]).on("zoom", e => graphG.attr("transform", e.transform));
svg.call(zoomBehavior);

function applyAdaptiveZoom() {
  const container = document.querySelector("#panel-left .panel-body");
  const W = container.clientWidth;
  const H = container.clientHeight;
  // Fewer nodes = more zoom, more nodes = less zoom
  const s = currentTop <= 10 ? 1.5 : currentTop <= 15 ? 1.3 : currentTop <= 20 ? 1.15 : 1.0;
  const tx = (W - W * s) / 2;
  const ty = (H - H * s) / 2;
  svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(s));
}

function buildGraph() {
  const container = document.querySelector("#panel-left .panel-body");
  const W = container.clientWidth;
  const H = container.clientHeight;
  svg.attr("viewBox", [0, 0, W, H]);

  // get edges — "Todos" aggregates all presidents
  let edges;
  if (currentPres === "Todos") {
    // Aggregate: sum counts for same bigram pairs across presidents
    const agg = {};
    BI_RAW.forEach(d => {
      const key = d.w1 + "|" + d.w2;
      if (!agg[key]) agg[key] = { w1: d.w1, w2: d.w2, n: 0, p: "Todos", y: 0, c: "", o: "" };
      agg[key].n += d.n;
    });
    edges = Object.values(agg).sort((a, b) => b.n - a.n);
  } else {
    edges = BI_RAW.filter(d => d.p === currentPres).sort((a,b) => b.n - a.n);
  }
  edges = edges.slice(0, currentTop);

  // filter by unigram frequency
  const uniFreqs = getUnigramFreqs(currentPres);
  edges = edges.filter(d => {
    const f1 = uniFreqs[d.w1] || 0;
    const f2 = uniFreqs[d.w2] || 0;
    return (f1 >= freqMin && f1 <= freqMax) || (f2 >= freqMin && f2 <= freqMax);
  });

  // build node set with degree + weight (sum of edge counts)
  const nodeMap = new Map();
  edges.forEach(e => {
    if (!nodeMap.has(e.w1)) nodeMap.set(e.w1, { id: e.w1, degree: 0, weight: 0 });
    if (!nodeMap.has(e.w2)) nodeMap.set(e.w2, { id: e.w2, degree: 0, weight: 0 });
    nodeMap.get(e.w1).degree++;
    nodeMap.get(e.w2).degree++;
    nodeMap.get(e.w1).weight += e.n;
    nodeMap.get(e.w2).weight += e.n;
  });
  const nodes = Array.from(nodeMap.values());

  const links = edges.map((e, i) => ({
    source: e.w1,
    target: e.w2,
    value: e.n,
    idx: i
  }));

  const base = getBaseColor(currentPres);
  const palette = edgeColorPalette(base);

  // scales — importance = degree + weight combined
  const maxDeg = d3.max(nodes, d => d.degree) || 1;
  const maxWeight = d3.max(nodes, d => d.weight) || 1;
  nodes.forEach(d => d.importance = (d.degree / maxDeg + d.weight / maxWeight) / 2);
  const rScale = d3.scaleSqrt().domain([1, maxDeg]).range([3, 8]);
  const maxVal = d3.max(links, d => d.value) || 1;
  const wScale = d3.scaleLinear().domain([1, maxVal]).range([1, 3.5]);

  // clear & add arrow marker defs
  graphG.selectAll("*").remove();
  const defs = graphG.append("defs");
  palette.forEach((col, i) => {
    defs.append("marker")
      .attr("id", "arrow-" + i)
      .attr("viewBox", "0 -4 10 8")
      .attr("refX", 0)
      .attr("refY", 0)
      .attr("markerWidth", 12)
      .attr("markerHeight", 12)
      .attr("markerUnits", "userSpaceOnUse")
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-3.5L10,0L0,3.5")
      .attr("fill", col)
      .attr("opacity", 0.7);
  });

  if (simulation) simulation.stop();

  const R = Math.min(W, H) * 0.38;
  // Nodos con más peso+grado al centro, periféricos afuera
  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(55))
    .force("charge", d3.forceManyBody().strength(-90))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("radial", d3.forceRadial(d => R * (1 - d.importance), W / 2, H / 2).strength(0.5))
    .force("collision", d3.forceCollide().radius(d => rScale(d.degree) + 10));

  // edges (curved)
  const link = graphG.selectAll(".link")
    .data(links)
    .join("path")
    .attr("class", "link")
    .attr("stroke", (d, i) => palette[i % palette.length])
    .attr("stroke-width", d => wScale(d.value))
    .attr("marker-end", (d, i) => `url(#arrow-${i % palette.length})`);

  // nodes
  const node = graphG.selectAll(".node")
    .data(nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended));

  node.append("circle")
    .attr("r", d => rScale(d.degree))
    .attr("fill", base)
    .attr("opacity", 0.85);

  node.append("text")
    .text(d => d.id)
    .attr("dx", d => rScale(d.degree) + 3)
    .attr("dy", 3);

  // hover
  const tooltip = document.getElementById("tooltip");

  node.on("mouseover", function(event, d) {
    const connected = new Set();
    connected.add(d.id);
    links.forEach(l => {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      if (sid === d.id) connected.add(tid);
      if (tid === d.id) connected.add(sid);
    });
    node.classed("dimmed", n => !connected.has(n.id));
    link.classed("dimmed", l => {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      return sid !== d.id && tid !== d.id;
    });
    tooltip.style.opacity = 1;
    tooltip.textContent = `${d.id} (conexiones: ${d.degree})`;
    tooltip.style.left = event.clientX + 12 + "px";
    tooltip.style.top = event.clientY - 10 + "px";
  })
  .on("mousemove", function(event) {
    tooltip.style.left = event.clientX + 12 + "px";
    tooltip.style.top = event.clientY - 10 + "px";
  })
  .on("mouseout", function() {
    node.classed("dimmed", false);
    link.classed("dimmed", false);
    tooltip.style.opacity = 0;
  });

  simulation.on("tick", () => {
    // curved links
    link.attr("d", d => {
      const sx = d.source.x, sy = d.source.y;
      const tx = d.target.x, ty = d.target.y;
      const dx = tx - sx, dy = ty - sy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      // start from source node edge
      const sr = rScale(d.source.degree) + 1;
      const ox = sx + (dx / dist) * sr;
      const oy = sy + (dy / dist) * sr;
      // end before target node edge, leaving room for arrow
      const tr = rScale(d.target.degree) + 12;
      const ex = tx - (dx / dist) * tr;
      const ey = ty - (dy / dist) * tr;
      const dr = dist * (1.2 + (d.idx % 3) * 0.3);
      const sweep = d.idx % 2;
      return `M${ox},${oy}A${dr},${dr} 0 0,${sweep} ${ex},${ey}`;
    });
    node.attr("transform", d => {
      d.x = Math.max(20, Math.min(W - 20, d.x));
      d.y = Math.max(20, Math.min(H - 20, d.y));
      return `translate(${d.x},${d.y})`;
    });
  });

  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) {
    d.fx = event.x; d.fy = event.y;
  }
  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
}

// ═══════════════════════════════════════════════════════════
//  WORD CLOUD  (spiral placement)
// ═══════════════════════════════════════════════════════════
function buildWordCloud() {
  const outer = document.getElementById("wordcloud");
  outer.innerHTML = "";
  const container = document.createElement("div");
  container.id = "wc-inner";
  outer.appendChild(container);
  const W = outer.clientWidth;
  const H = outer.clientHeight;
  if (W === 0 || H === 0) return;

  // Zoom & pan via mouse
  let wcScale = 1, wcX = 0, wcY = 0, dragging = false, startX, startY;
  outer.addEventListener("wheel", e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    wcScale = Math.max(0.3, Math.min(5, wcScale * delta));
    container.style.transform = `translate(${wcX}px,${wcY}px) scale(${wcScale})`;
  }, { passive: false });
  outer.addEventListener("mousedown", e => { if (e.button === 0) { dragging = true; startX = e.clientX - wcX; startY = e.clientY - wcY; }});
  outer.addEventListener("mousemove", e => { if (dragging) { wcX = e.clientX - startX; wcY = e.clientY - startY; container.style.transform = `translate(${wcX}px,${wcY}px) scale(${wcScale})`; }});
  outer.addEventListener("mouseup", () => dragging = false);
  outer.addEventListener("mouseleave", () => dragging = false);

  let words;
  if (currentPres === "Todos") {
    const agg = {};
    UNI_RAW.forEach(d => { agg[d.w] = (agg[d.w] || 0) + d.n; });
    words = Object.entries(agg).map(([w, n]) => ({ w, n })).filter(d => d.n >= freqMin && d.n <= freqMax).sort((a, b) => b.n - a.n);
  } else {
    words = UNI_RAW.filter(d => d.p === currentPres && d.n >= freqMin && d.n <= freqMax).sort((a,b) => b.n - a.n);
  }
  words = words.slice(0, currentTop);

  const maxN = words[0] ? words[0].n : 1;
  const minN = words[words.length - 1] ? words[words.length - 1].n : 1;

  // font size scale — adaptive to number of words
  const maxFont = words.length <= 10 ? 58 : words.length <= 15 ? 50 : words.length <= 20 ? 44 : 36;
  const minFont = words.length <= 15 ? 13 : 10;
  const fScale = d3.scaleSqrt().domain([minN, maxN]).range([minFont, maxFont]).clamp(true);

  // Step 1: render all spans hidden to measure real sizes via getBoundingClientRect
  const spans = [];
  words.forEach((wd, i) => {
    const fontSize = fScale(wd.n);
    const span = document.createElement("span");
    span.className = "wc-word";
    span.textContent = wd.w;
    span.style.fontSize = fontSize + "px";
    span.style.color = WC_COLORS[i % WC_COLORS.length];
    span.style.lineHeight = "1.1";
    span.style.left = "-9999px";
    span.style.top = "-9999px";
    span.dataset.word = wd.w;
    span.title = `${wd.w}: ${wd.n}`;
    container.appendChild(span);
    spans.push({ span, wd, fontSize, idx: i });
  });

  // Step 2: measure and place using spiral
  requestAnimationFrame(() => {
    const placed = [];
    let placedCount = 0;
    const cx = W / 2, cy = H / 2;
    const PAD = 2;

    function overlaps(rect) {
      for (const r of placed) {
        if (rect.x < r.x + r.w + PAD && rect.x + rect.w + PAD > r.x &&
            rect.y < r.y + r.h + PAD && rect.y + rect.h + PAD > r.y) return true;
      }
      return false;
    }

    spans.forEach(({ span, wd, fontSize, idx }) => {
      const rect = span.getBoundingClientRect();
      const bw = Math.ceil(rect.width) + 1;
      const bh = Math.ceil(rect.height) + 1;

      let px, py, found = false;
      for (let t = 0; t < 2500; t++) {
        const angle = t * 0.13;
        const radius = 0.5 + t * 0.28;
        px = cx + radius * Math.cos(angle) - bw / 2;
        py = cy + radius * Math.sin(angle) - bh / 2;

        const r = { x: px, y: py, w: bw, h: bh };
        if (px >= 0 && py >= 0 && px + bw <= W && py + bh <= H && !overlaps(r)) {
          placed.push(r);
          found = true;
          break;
        }
      }

      if (found) {
        span.style.left = px + "px";
        span.style.top = py + "px";
        const delay = placedCount * 15;
        setTimeout(() => span.classList.add("visible"), delay);
        placedCount++;
      } else {
        span.remove();
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  SEARCH HIGHLIGHT
// ═══════════════════════════════════════════════════════════
function applySearch() {
  if (!searchTerm) {
    // remove all highlights/dims
    document.querySelectorAll(".wc-word").forEach(el => {
      el.classList.remove("dimmed", "highlighted");
    });
    d3.selectAll(".node").classed("dimmed", false).classed("highlighted", false);
    d3.selectAll(".link").classed("dimmed", false);
    return;
  }
  // word cloud
  document.querySelectorAll(".wc-word").forEach(el => {
    const w = el.dataset.word;
    if (w.includes(searchTerm)) {
      el.classList.remove("dimmed");
      el.classList.add("highlighted");
    } else {
      el.classList.add("dimmed");
      el.classList.remove("highlighted");
    }
  });
  // graph
  const matchNodes = new Set();
  d3.selectAll(".node").each(function(d) {
    if (d.id.includes(searchTerm)) matchNodes.add(d.id);
  });
  // also include neighbors
  const connected = new Set(matchNodes);
  d3.selectAll(".link").each(function(d) {
    const sid = typeof d.source === "object" ? d.source.id : d.source;
    const tid = typeof d.target === "object" ? d.target.id : d.target;
    if (matchNodes.has(sid)) connected.add(tid);
    if (matchNodes.has(tid)) connected.add(sid);
  });
  if (matchNodes.size > 0) {
    d3.selectAll(".node").classed("dimmed", d => !connected.has(d.id));
    d3.selectAll(".node").classed("highlighted", d => matchNodes.has(d.id));
    d3.selectAll(".link").classed("dimmed", d => {
      const sid = typeof d.source === "object" ? d.source.id : d.source;
      const tid = typeof d.target === "object" ? d.target.id : d.target;
      return !matchNodes.has(sid) && !matchNodes.has(tid);
    });
  } else {
    d3.selectAll(".node").classed("dimmed", true).classed("highlighted", false);
    d3.selectAll(".link").classed("dimmed", true);
  }
}

// ═══════════════════════════════════════════════════════════
//  PAGE 2: 3×3 GRID OF ALL BIGRAM NETWORKS
// ═══════════════════════════════════════════════════════════
let page2Built = false;

function getPresYear(pres) {
  const rec = UNI_RAW.find(d => d.p === pres);
  return rec ? rec.y : "";
}

// Expand a mini panel into overlay
function expandPanel(pres) {
  const overlay = document.getElementById("panel-overlay");
  const header = document.getElementById("expanded-header");
  const title = document.getElementById("expanded-title");
  const body = document.getElementById("expanded-body");
  body.innerHTML = "";
  title.textContent = pres + " (" + getPresYear(pres) + ")";
  header.style.background = getBaseColor(pres);
  overlay.classList.add("active");

  requestAnimationFrame(() => {
    const W = body.clientWidth;
    const H = body.clientHeight;
    if (!W || !H) return;

    const base = getBaseColor(pres);
    const palette = edgeColorPalette(base);
    const uniFreqs = getUnigramFreqs(pres);
    let edges = BI_RAW.filter(d => d.p === pres).sort((a,b) => b.n - a.n).slice(0, currentTop);
    edges = edges.filter(d => {
      const f1 = uniFreqs[d.w1] || 0;
      const f2 = uniFreqs[d.w2] || 0;
      return (f1 >= freqMin && f1 <= freqMax) || (f2 >= freqMin && f2 <= freqMax);
    });

    const nodeMap = new Map();
    edges.forEach(e => {
      if (!nodeMap.has(e.w1)) nodeMap.set(e.w1, { id: e.w1, degree: 0, weight: 0 });
      if (!nodeMap.has(e.w2)) nodeMap.set(e.w2, { id: e.w2, degree: 0, weight: 0 });
      nodeMap.get(e.w1).degree++; nodeMap.get(e.w2).degree++;
      nodeMap.get(e.w1).weight += e.n; nodeMap.get(e.w2).weight += e.n;
    });
    const nodes = Array.from(nodeMap.values());
    const links = edges.map((e, i) => ({ source: e.w1, target: e.w2, value: e.n, idx: i }));
    if (!nodes.length) return;

    const maxDeg = d3.max(nodes, d => d.degree) || 1;
    const maxWt = d3.max(nodes, d => d.weight) || 1;
    nodes.forEach(d => d.importance = (d.degree / maxDeg + d.weight / maxWt) / 2);
    const rScale = d3.scaleSqrt().domain([1, maxDeg]).range([3, 8]);
    const maxVal = d3.max(links, d => d.value) || 1;
    const wScale = d3.scaleLinear().domain([1, maxVal]).range([1, 3.5]);

    const svgEl = d3.select(body).append("svg").attr("viewBox", [0, 0, W, H]);
    const g = svgEl.append("g");
    svgEl.call(d3.zoom().scaleExtent([0.3, 5]).on("zoom", e => g.attr("transform", e.transform)));

    const defs = g.append("defs");
    palette.forEach((col, i) => {
      defs.append("marker").attr("id", "exp-arrow-" + i)
        .attr("viewBox", "0 -4 10 8").attr("refX", 0).attr("refY", 0)
        .attr("markerWidth", 12).attr("markerHeight", 12)
        .attr("markerUnits", "userSpaceOnUse").attr("orient", "auto")
        .append("path").attr("d", "M0,-3.5L10,0L0,3.5").attr("fill", col).attr("opacity", 0.7);
    });

    const R = Math.min(W, H) * 0.35;
    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(55))
      .force("charge", d3.forceManyBody().strength(-90))
      .force("center", d3.forceCenter(W / 2, H / 2))
      .force("radial", d3.forceRadial(d => R * (1 - d.importance), W / 2, H / 2).strength(0.5))
      .force("collision", d3.forceCollide().radius(d => rScale(d.degree) + 10));

    const eLink = g.selectAll(".link").data(links).join("path").attr("class", "link")
      .attr("fill", "none").attr("stroke", (d, i) => palette[i % palette.length])
      .attr("stroke-width", d => wScale(d.value)).attr("marker-end", (d, i) => `url(#exp-arrow-${i % palette.length})`);

    const eNode = g.selectAll(".node").data(nodes).join("g").attr("class", "node");
    eNode.append("circle").attr("r", d => rScale(d.degree)).attr("fill", base).attr("opacity", 0.85).attr("stroke", "#fff").attr("stroke-width", 1);
    eNode.append("text").text(d => d.id).attr("dx", d => rScale(d.degree) + 3).attr("dy", 3).attr("font-size", "9.5px").attr("fill", "#555").attr("font-weight", 500).attr("pointer-events", "none");

    eNode.call(d3.drag()
      .on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

    eNode.on("mouseover", function(ev, d) {
      const c = new Set([d.id]);
      links.forEach(l => { const s = typeof l.source === "object" ? l.source.id : l.source; const t = typeof l.target === "object" ? l.target.id : l.target; if (s === d.id) c.add(t); if (t === d.id) c.add(s); });
      eNode.classed("dimmed", n => !c.has(n.id)); eLink.classed("dimmed", l => { const s = typeof l.source === "object" ? l.source.id : l.source; const t = typeof l.target === "object" ? l.target.id : l.target; return s !== d.id && t !== d.id; });
    }).on("mouseout", () => { eNode.classed("dimmed", false); eLink.classed("dimmed", false); });

    sim.on("tick", () => {
      eLink.attr("d", d => {
        const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
        const dx = tx - sx, dy = ty - sy, dist = Math.sqrt(dx*dx+dy*dy) || 1;
        const sr = rScale(d.source.degree)+1, ox = sx+(dx/dist)*sr, oy = sy+(dy/dist)*sr;
        const tr = rScale(d.target.degree)+12, ex = tx-(dx/dist)*tr, ey = ty-(dy/dist)*tr;
        const dr = dist*(1.2+(d.idx%3)*0.3), sweep = d.idx%2;
        return `M${ox},${oy}A${dr},${dr} 0 0,${sweep} ${ex},${ey}`;
      });
      eNode.attr("transform", d => { d.x = Math.max(15, Math.min(W-15, d.x)); d.y = Math.max(15, Math.min(H-15, d.y)); return `translate(${d.x},${d.y})`; });
    });

    // Stop simulation on close
    overlay._sim = sim;
  });
}

document.getElementById("expanded-close").addEventListener("click", () => {
  const overlay = document.getElementById("panel-overlay");
  if (overlay._sim) overlay._sim.stop();
  overlay.classList.remove("active");
});
document.getElementById("panel-overlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) {
    if (e.currentTarget._sim) e.currentTarget._sim.stop();
    e.currentTarget.classList.remove("active");
  }
});

function buildPage2() {
  const container = document.getElementById("page2-grid");
  container.innerHTML = "";
  page2Built = true;

  // Build sidebar with search/frequency/top filters
  const sidebar = document.getElementById("page2-sidebar");
  sidebar.innerHTML = `
    <div class="ctrl-card">
      <span class="ctrl-label">Búsqueda por término</span>
      <div class="ctrl-content"><input id="search-input-p2" type="text" placeholder="término..."></div>
    </div>
    <div class="ctrl-card">
      <span class="ctrl-label">Frecuencia término</span>
      <div class="ctrl-content freq-row">
        <input type="number" id="freq-min-p2" min="0" value="0" class="freq-num">
        <input type="range" id="freq-slider-p2" min="0" max="10" step="1" value="0" class="freq-range">
        <input type="number" id="freq-max-p2" min="0" value="99" class="freq-num">
      </div>
    </div>
    <div class="ctrl-card">
      <span class="ctrl-label">Top</span>
      <div class="ctrl-content">
        <select id="top-select-p2">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50" selected>50</option>
        </select>
      </div>
    </div>`;
  // Wire up sidebar controls for page 2
  document.getElementById("search-input-p2").addEventListener("input", e => {
    searchTerm = e.target.value.trim().toLowerCase();
    applySearch();
  });
  const p2TopSel = document.getElementById("top-select-p2");
  p2TopSel.value = currentTop;
  p2TopSel.addEventListener("change", e => {
    currentTop = +e.target.value;
    page2Built = false;
    buildPage2();
  });
  const p2FreqMin = document.getElementById("freq-min-p2");
  const p2FreqMax = document.getElementById("freq-max-p2");
  const p2FreqSlider = document.getElementById("freq-slider-p2");
  const allUniMax = d3.max(UNI_RAW, d => d.n) || 1;
  p2FreqMin.value = freqMin;
  p2FreqMax.value = freqMax;
  p2FreqSlider.max = allUniMax;
  p2FreqSlider.value = freqMin;
  function applyP2Freq() {
    freqMin = +p2FreqMin.value || 0;
    freqMax = +p2FreqMax.value || 99;
    page2Built = false;
    buildPage2();
  }
  p2FreqMin.addEventListener("change", () => { p2FreqSlider.value = p2FreqMin.value; applyP2Freq(); });
  p2FreqMax.addEventListener("change", applyP2Freq);
  p2FreqSlider.addEventListener("input", () => { p2FreqMin.value = p2FreqSlider.value; applyP2Freq(); });

  PRESIDENTS.forEach(pres => {
    const panel = document.createElement("div");
    panel.className = "mini-panel";

    const header = document.createElement("div");
    header.className = "mini-header";
    header.textContent = pres + " (" + getPresYear(pres) + ")";
    header.style.background = getBaseColor(pres);
    panel.appendChild(header);

    const body = document.createElement("div");
    body.className = "mini-body";
    panel.appendChild(body);

    // Click to expand
    panel.addEventListener("click", (e) => {
      if (e.target.closest(".node")) return; // don't expand when dragging nodes
      expandPanel(pres);
    });

    container.appendChild(panel);
  });

  // Use requestAnimationFrame to ensure DOM layout is computed
  requestAnimationFrame(() => {
    PRESIDENTS.forEach((pres, idx) => {
      const body = container.querySelectorAll(".mini-body")[idx];
      const W = body.clientWidth;
      const H = body.clientHeight;
      if (W === 0 || H === 0) return;

      // Build edges & nodes — same filters as page 1
      const uniFreqs = getUnigramFreqs(pres);
      const p2Top = document.getElementById("top-select-p2");
      let edges = BI_RAW.filter(d => d.p === pres).sort((a,b) => b.n - a.n).slice(0, p2Top ? +p2Top.value : 10);
      edges = edges.filter(d => {
        const f1 = uniFreqs[d.w1] || 0;
        const f2 = uniFreqs[d.w2] || 0;
        return (f1 >= freqMin && f1 <= freqMax) || (f2 >= freqMin && f2 <= freqMax);
      });
      const nodeMap = new Map();
      edges.forEach(e => {
        if (!nodeMap.has(e.w1)) nodeMap.set(e.w1, { id: e.w1, degree: 0, weight: 0 });
        if (!nodeMap.has(e.w2)) nodeMap.set(e.w2, { id: e.w2, degree: 0, weight: 0 });
        nodeMap.get(e.w1).degree++;
        nodeMap.get(e.w2).degree++;
        nodeMap.get(e.w1).weight += e.n;
        nodeMap.get(e.w2).weight += e.n;
      });
      const nodes = Array.from(nodeMap.values());
      const links = edges.map((e, i) => ({
        source: e.w1,
        target: e.w2,
        value: e.n,
        idx: i
      }));

      if (nodes.length === 0) return;

      const base = getBaseColor(pres);
      const palette = edgeColorPalette(base);

      // Scales
      const maxDeg = d3.max(nodes, d => d.degree) || 1;
      const maxWt = d3.max(nodes, d => d.weight) || 1;
      nodes.forEach(d => d.importance = (d.degree / maxDeg + d.weight / maxWt) / 2);
      const rScale = d3.scaleSqrt().domain([1, maxDeg]).range([2, 9]);
      const maxVal = d3.max(links, d => d.value) || 1;
      const wScale = d3.scaleLinear().domain([1, maxVal]).range([0.8, 4]);

      // Create SVG with zoom
      const svgEl = d3.select(body).append("svg")
        .attr("viewBox", [0, 0, W, H]);
      const g = svgEl.append("g");
      svgEl.call(d3.zoom().scaleExtent([0.3, 5]).on("zoom", e => g.attr("transform", e.transform)));

      // Arrow markers (smaller)
      const defs = g.append("defs");
      palette.forEach((col, i) => {
        defs.append("marker")
          .attr("id", "mini-arrow-" + pres.replace(/\s/g,"") + "-" + i)
          .attr("viewBox", "0 -3 8 6")
          .attr("refX", 0)
          .attr("refY", 0)
          .attr("markerWidth", 8)
          .attr("markerHeight", 8)
          .attr("markerUnits", "userSpaceOnUse")
          .attr("orient", "auto")
          .append("path")
          .attr("d", "M0,-2.5L8,0L0,2.5")
          .attr("fill", col)
          .attr("opacity", 0.7);
      });

      // Force simulation — animated like page 1
      const miniR = Math.min(W, H) * 0.32;
      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(22))
        .force("charge", d3.forceManyBody().strength(-30))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("radial", d3.forceRadial(d => miniR * (1 - d.importance), W / 2, H / 2).strength(0.5))
        .force("collision", d3.forceCollide().radius(d => rScale(d.degree) + 3));

      // Draw edges
      const mLink = g.selectAll(".link")
        .data(links)
        .join("path")
        .attr("class", "link")
        .attr("fill", "none")
        .attr("stroke", (d, i) => palette[i % palette.length])
        .attr("stroke-width", d => wScale(d.value))
        .attr("stroke-opacity", 0.5)
        .attr("marker-end", (d, i) => `url(#mini-arrow-${pres.replace(/\s/g,"")}-${i % palette.length})`);

      // Draw nodes
      const mNode = g.selectAll(".node")
        .data(nodes)
        .join("g")
        .attr("class", "node");

      mNode.append("circle")
        .attr("r", d => rScale(d.degree))
        .attr("fill", base)
        .attr("opacity", 0.85)
        .attr("stroke", "#fff")
        .attr("stroke-width", 0.8);

      mNode.append("text")
        .text(d => d.id)
        .attr("dx", d => rScale(d.degree) + 2)
        .attr("dy", 2.5)
        .attr("font-size", "7.5px")
        .attr("fill", "#555")
        .attr("font-weight", 500)
        .attr("pointer-events", "none");

      // Drag
      mNode.call(d3.drag()
        .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

      // Hover highlight
      mNode.on("mouseover", function(event, d) {
        const connected = new Set([d.id]);
        links.forEach(l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          if (sid === d.id) connected.add(tid);
          if (tid === d.id) connected.add(sid);
        });
        mNode.classed("dimmed", n => !connected.has(n.id));
        mLink.classed("dimmed", l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          return sid !== d.id && tid !== d.id;
        });
      }).on("mouseout", function() {
        mNode.classed("dimmed", false);
        mLink.classed("dimmed", false);
      });

      sim.on("tick", () => {
        mLink.attr("d", d => {
          const sx = d.source.x, sy = d.source.y;
          const tx = d.target.x, ty = d.target.y;
          const dx = tx - sx, dy = ty - sy;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const sr = rScale(d.source.degree) + 1;
          const ox = sx + (dx / dist) * sr;
          const oy = sy + (dy / dist) * sr;
          const tr = rScale(d.target.degree) + 9;
          const ex = tx - (dx / dist) * tr;
          const ey = ty - (dy / dist) * tr;
          const dr = dist * (1.2 + (d.idx % 3) * 0.3);
          const sweep = d.idx % 2;
          return `M${ox},${oy}A${dr},${dr} 0 0,${sweep} ${ex},${ey}`;
        });
        mNode.attr("transform", d => {
          d.x = Math.max(12, Math.min(W - 12, d.x));
          d.y = Math.max(12, Math.min(H - 12, d.y));
          return `translate(${d.x},${d.y})`;
        });
      });
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════
function update() {
  updateFreqRange();
  buildGraph();
  buildWordCloud();
  setTimeout(applyAdaptiveZoom, 300);
  if (searchTerm) applySearch();
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener("resize", () => {
  if (currentPage === 1) update();
  else { page2Built = false; buildPage2(); }
});
update();
</script>
